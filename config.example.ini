[credentials]
username = your_email@example.com
password = your_password

[browser_settings]
headless = true
browsers = 3

[personnel_settings]
# 0: Disabled
# 1, 2, 3: Recruit for X days
# -1: Automatic (Requires Premium)
hiring_mode = 3

[delays]
missions = 10
transport = 60
# Delay in seconds between personnel checks (e.g., 3600 = 1 hour)
personnel_check = 3600

[mission_settings]
# Set to false to stop sharing missions with your alliance
share_alliance = true
# Set to false if you want to ignore alliance missions completely
process_alliance = true
# Grace period before dispatching alliance missions (lets allies respond). 0 = immediate
alliance_delay = 45

[server_settings]
# Region code: us, uk, de, fr, nl, au, cz, dk, fi, it, kr, no, pl, pt, se, etc (19 total)
# See dashboard for list and URLs — changes require restart or dashboard sync
code = us
# Auto-update .mscv definitions from cfHxqA/Mission-Chief.Bot (requires internet)
auto_update = true
# How often to check for updates (seconds) — used by dashboard background check
refresh_interval = 3600
# Local cache dir for remote assets (relative to project root)
cache_dir = assets_cache
# Manifest URL (advanced)
manifest_url = https://raw.githubusercontent.com/cfHxqA/Mission-Chief.Bot/master/Assets.json
server_manifest_url = https://raw.githubusercontent.com/cfHxqA/Mission-Chief.Bot/master/Assets/Server.json

[transport_settings]
# Allow using alliance hospitals/cells for transport (shared)
allow_alliance_hospitals = true
allow_alliance_cells = true
# Max distance in km (0 = unlimited) — missions beyond are released if prisoner
max_distance = 0
# Max alliance tax % tolerated (0 = unlimited) — skip alliance hospitals/cells above
alliance_max_tax = 0

[dispatch_settings]
# Minimum % of required vehicles that must be available to dispatch (0-100)
# 100 recommended: two-stage dispatch handles the rest after scene arrival
min_percent = 100
# Try to use Alarm & Response Regulation (AAR) API for faster dispatch (experimental)
use_aar = false
# Only dispatch specialized vehicles whose crew has the required training (Phase 3)
require_training = false
# In-flight vehicle reservation lock duration in seconds (anti double-dispatch)
lock_ttl = 12
# Two-stage dispatch: send only 100% guaranteed needs; expand at Status 4
two_stage = true
# Max dispatch radius in km — solver ignores candidates beyond (0 = unlimited)
max_dispatch_distance = 0
# Require a towing vehicle in the SAME station as the trailer
strict_trailer_pairing = true

[api_settings]
# Humanized delay between API requests (anti-bot smoothing)
min_jitter_ms = 100
max_jitter_ms = 400
# Retry attempts on 429/5xx errors
max_retries = 3
# Exponential backoff multiplier between retries
backoff_factor = 1.5

[ingestion_settings]
# auto = API v2 with DOM fallback; api_v2 = strict API; dom = legacy HTML scraping
api_mode = auto
# Enrich vehicle data with crew/training at refresh (one extra page load per vehicle)
crew_scrape = true

[mission_filter]
# Ignore storm/event missions (true to skip)
ignore_storm = false
ignore_event = true
# Minimum credits to process (0 = all)
min_credits = 0
