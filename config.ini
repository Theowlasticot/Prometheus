[credentials]
username = 
password = 

[browser_settings]
headless = true
browsers = 2

[personnel_settings]
# 0: Disabled
# 1, 2, 3: Recruit for X days
# -1: Automatic (Requires Premium)
hiring_mode = 3

[delays]
missions = 10
transport = 60
# Delay in seconds between personnel checks (e.g., 3600 = 1 hour)
personnel_check = 3600

[mission_settings]
# Set to false to stop sharing missions with your alliance
share_alliance = true
# Set to false if you want to ignore alliance missions completely
process_alliance = true

[server_settings]
# Region code: us, uk, de, fr, nl, au, cz, dk, fi, it, kr, no, pl, pt, se, etc (19 total)
# See dashboard for list and URLs — changes require restart or dashboard sync
code = us
# Auto-update .mscv definitions from cfHxqA/Mission-Chief.Bot (requires internet)
auto_update = true
# How often to check for updates (seconds) — used by dashboard background check
refresh_interval = 3600
# Local cache dir for remote assets (relative to project root)
cache_dir = assets_cache
# Manifest URL (advanced)
manifest_url = https://raw.githubusercontent.com/cfHxqA/Mission-Chief.Bot/master/Assets.json
server_manifest_url = https://raw.githubusercontent.com/cfHxqA/Mission-Chief.Bot/master/Assets/Server.json
